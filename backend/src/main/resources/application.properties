# ===================== SERVER =====================
server.port=3035

# ===================== MYSQL DATABASE =====================
# Create the database first: CREATE DATABASE eventhub_db;
spring.datasource.url=jdbc:mysql://localhost:3306/eventhub_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=tiger
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================== JPA / HIBERNATE =====================
# update = creates/updates tables automatically from your entities (good for dev)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================== JWT =====================
# Change this secret before deploying anywhere real. Keep it out of source control in production.
jwt.secret=eventhub-super-secret-key-change-this-in-production-1234567890
jwt.expiration-ms=86400000

# ===================== MISC =====================
spring.jackson.serialization.fail-on-empty-beans=false
