# ===================== SERVER =====================
server.port=${PORT:3035}

# ===================== MYSQL DATABASE =====================
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/eventhub_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:tiger}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================== JPA / HIBERNATE =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================== JWT =====================
jwt.secret=${JWT_SECRET:eventhub-super-secret-key-change-this-in-production-1234567890}
jwt.expiration-ms=86400000

# ===================== MISC =====================
spring.jackson.serialization.fail-on-empty-beans=false
